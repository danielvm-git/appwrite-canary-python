name: Test Build Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_TYPE: python
  SITE_URL: https://python.danielvm.net

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/preflight.sh
      - name: Conventional Commits
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          git log origin/main..HEAD --no-merges --format=%s | while read -r line; do
            echo "$line" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: ' || exit 1
          done

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install big-release
        run: |
          curl -sL https://github.com/danielvm-git/big-release/releases/latest/download/big-release-linux-amd64 -o big-release
          chmod +x big-release && sudo mv big-release /usr/local/bin/
      - name: Configure git identity for big-release
        run: |
          git config user.name "big-release-bot"
          git config user.email "big-release-bot@danielvm-git.github.io"
      - name: Run big-release
        run: big-release release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: big-release-bot
          GIT_AUTHOR_EMAIL: big-release-bot@danielvm-git.github.io
          GIT_COMMITTER_NAME: big-release-bot
          GIT_COMMITTER_EMAIL: big-release-bot@danielvm-git.github.io
      - name: Sync VERSION file
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$TAG" ]; then
            echo "${TAG#v}" > VERSION
            git config user.name "big-release-bot"
            git config user.email "big-release-bot@danielvm-git.github.io"
            git add VERSION package.json CHANGELOG.md 2>/dev/null || git add VERSION CHANGELOG.md
            git diff --cached --quiet || git commit -m "chore(release): sync VERSION from $TAG [skip ci]"
            git push origin main
          fi

  build:
    needs: [test, release]
    if: >-
      always() && needs.test.result == 'success' &&
      (github.event_name == 'pull_request' || needs.release.result == 'success')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: test -f public/shell/SHELL_PIN
      - name: Write VERSION for build
        run: |
          if [ ! -f VERSION ]; then
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo v0.1.0)
            echo "${TAG#v}" > VERSION
          fi
      - name: Build
        env:
          VITE_APPWRITE_ENDPOINT: ${{ vars.VITE_APPWRITE_ENDPOINT }}
          VITE_APPWRITE_PROJECT_ID: ${{ vars.VITE_APPWRITE_PROJECT_ID }}
          VITE_SHARE_FUNCTION_ID: ${{ vars.VITE_SHARE_FUNCTION_ID }}
          VITE_CANARY_NAME: ${{ vars.VITE_CANARY_NAME }}
          VITE_REPO_URL: ${{ vars.VITE_REPO_URL }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/