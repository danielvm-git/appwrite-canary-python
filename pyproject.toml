[project]
name = "appwrite-canary-python"
version = "0.0.0"
description = "Appwrite Sites canary — Python"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115.0", "uvicorn[standard]>=0.34.0", "jinja2>=3.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.9.0", "mypy>=1.14.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canary"]